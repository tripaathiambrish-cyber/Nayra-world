<!DOCTYPE html>
<html>
<head>
<title>Nayra World</title>
<link rel="stylesheet" href="style.css">
</head>

<body>

<div class="app">

<h1>🎀 Welcome to Nayra World 🎀</h1>
<p>Your AI Companion ✨</p>


<div class="card">
<h2>👤 Profile</h2>

<p id="username">User</p>
<p>ID: <span id="userid">---</span></p>

</div>


<div class="card">

<h2>🪙 Nayra Coins</h2>

<h3 id="coins">
0 Coins
</h3>

<button onclick="dailyReward()">
🎁 Daily Reward
</button>

<p id="reward"></p>

</div>



<div class="card">

<h2>🤖 AI Assistant</h2>

<button onclick="openAI()">
Chat with Nayra
</button>

</div>



<div class="card">

<h2>🎉 Wishes</h2>

<button onclick="wish()">
Create Wish
</button>

<p id="wish">
</p>

</div>



<div class="card">

<h2>🏆 Leaderboard</h2>

<p>
🥇 Nayra User 1000
</p>

<p>
🥈 User 800
</p>

<p>
🥉 User 500
</p>

</div>



<div class="card">

<h2>⚙️ Settings</h2>

<button onclick="darkMode()">
🌙 Dark Mode
</button>


</div>


</div>


<script src="app.js"></script>

</body>
</html>
